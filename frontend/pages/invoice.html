<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet" />
		<!-- <link href="http://127.0.0.1:5500/frontend/src/tailwindcss@v4.1.3/tailwind.css" rel="stylesheet" /> -->
		<link rel="stylesheet" href="../src/output.css" />
		<link rel="stylesheet" href="../src/input.css" />
		<script src="https://unpkg.com/@popperjs/core@2"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="../js/script.js" defer></script>
		<script src="../js/invoice.js" defer></script>
		<title>Daftar Invoice</title>
	</head>
	<body class="text-white font-popins">
		<!-- start: Sidebar -->
		<div class="bg-secondary text-white fixed left-0 top-0 w-64 h-full p-4 z-50 sidebar-menu transition-transform">
			<a href="#" class="flex items-center pb-4 border-b border-b-gray-800">
				<img src="https://placehold.co/32x32" alt="" class="w-8 h-8 rounded object-cover" />
				<span class="text-lg font-bold text-white ml-3">Machine Cashier</span>
				<hr class="my-2 text-gray-600" />
			</a>
			<ul class="mt-4">
				<li class="mb-1 group">
					<a
						href="dashboard.html"
						class="flex items-center py-2 px-4 text-gray-300 hover:bg-gray-950 hover:text-gray-100 rounded-md group-[.active]:bg-gray-800 group-[.active]:text-white group-[.selected]:bg-gray-950"
					>
						<i class="ri-home-2-fill mr-3 text-lg"></i>
						<span class="text-sm">Dashboard</span>
					</a>
				</li>

				<li class="mb-1 group active">
					<a
						href="invoice.html"
						class="flex items-center py-2 px-4 text-gray-300 hover:bg-gray-950 hover:text-gray-100 rounded-md group-[.active]:bg-gray-800 group-[.active]:text-white group-[.selected]:bg-gray-950 group-[.selected]:text-gray-100"
					>
						<i class="ri-receipt-fill mr-3 text-lg"></i>
						<span class="text-sm">Invoices</span>
					</a>
				</li>

				<li class="mb-1 group">
					<a
						href="barang.html"
						class="flex items-center py-2 px-4 text-gray-300 hover:bg-gray-950 hover:text-gray-100 rounded-md group-[.active]:bg-gray-800 group-[.active]:text-white group-[.selected]:bg-gray-950 group-[.selected]:text-gray-100"
					>
						<i class="ri-box-3-fill mr-3 text-lg"></i>
						<span class="text-sm">Barang</span>
					</a>
				</li>

				<li class="mb-1 group">
					<a
						href="member.html"
						class="flex items-center py-2 px-4 text-gray-300 hover:bg-gray-950 hover:text-gray-100 rounded-md group-[.active]:bg-gray-800 group-[.active]:text-white group-[.selected]:bg-gray-950 group-[.selected]:text-gray-100"
					>
						<i class="ri-team-fill mr-3 text-lg"></i>
						<span class="text-sm">Member</span>
					</a>
				</li>
				<hr class="my-2 text-gray-600" />
				<li class="mb-1 group">
					<a
						href="#"
						class="flex items-center py-2 px-4 text-gray-300 hover:bg-gray-950 hover:text-gray-100 rounded-md group-[.active]:bg-gray-800 group-[.active]:text-white group-[.selected]:bg-gray-950 group-[.selected]:text-gray-100"
					>
						<i class="ri-settings-2-line mr-3 text-lg"></i>
						<span class="text-sm">Settings</span>
					</a>
				</li>
			</ul>
		</div>
		<div class="text-white fixed top-0 left-0 w-full h-full bg-black/50 z-40 md:hidden sidebar-overlay"></div>
		<!-- end: Sidebar -->

		<!-- start: Main -->
		<main class="bg-main text-black w-full md:w-[calc(100%-256px)] md:ml-64 bg-gray-50 min-h-screen transition-all main">
			<!-- start: Navbar -->
			<div class="text-black py-2 px-6 bg-white flex items-center shadow-md shadow-black/5 sticky top-0 left-0 z-30">
				<button type="button" class="text-black sidebar-toggle">
					<i class="ri-menu-line"></i>
				</button>
				<ul class="flex items-center text-sm ml-4">
					<li class="mr-2">
						<a href="#" class="color-text hover:bg-gray-400 font-medium">Daftar Invoice</a>
					</li>
				</ul>
				<ul class="ml-auto flex items-center">
					<button id="toggleDarkMode" class="bg-gray-900 text-black font-semibold hover:text-green-500 transition duration-300"></button>
					<li class="mr-1 dropdown">
						<button type="button" class="dropdown-toggle text-black w-8 h-8 rounded flex items-center justify-center hover:bg-gray-50 hover:text-gray-600">
							<i class="ri-search-line"></i>
						</button>
						<div class="dropdown-menu shadow-md shadow-black/5 z-30 hidden max-w-xs w-full bg-white rounded-md border border-gray-100">
							<form action="" class="p-4 border-b border-b-gray-100">
								<div class="relative w-full">
									<input
										type="search"
										class="py-2 pr-4 pl-10 bg-gray-50 w-full outline-none border border-gray-100 rounded-md text-sm text-black focus:border-blue-500"
										placeholder="Search..."
									/>
									<i class="ri-search-line absolute top-1/2 left-4 -translate-y-1/2 text-gray-400"></i>
								</div>
							</form>
							<div class="mt-3 mb-2">
								<div class="text-[13px] font-medium text-gray-400 ml-4 mb-2">Recently</div>
								<ul class="max-h-64 overflow-y-auto">
									<li>
										<a href="#" class="py-2 px-4 flex items-center hover:bg-gray-50 group">
											<img src="https://placehold.co/32x32" alt="" class="w-8 h-8 rounded block object-cover align-middle" />
											<div class="ml-2">
												<div class="text-[13px] text-gray-600 font-medium truncate group-hover:text-blue-500">Invoices</div>
												<div class="text-[11px] text-gray-400">Rp. 500.000</div>
											</div>
										</a>
									</li>
								</ul>
							</div>
						</div>
					</li>
					<li class="dropdown ml-3">
						<button type="button" class="dropdown-toggle flex items-center cursor-pointer">
							<img src="https://placehold.co/32x32" alt="" class="w-8 h-8 rounded block object-cover align-middle" />
						</button>
						<ul class="dropdown-menu shadow-md shadow-black/5 z-30 hidden py-1.5 rounded-md bg-white border border-gray-100 w-full max-w-[140px]">
							<li>
								<a href="#" class="flex items-center text-[13px] py-1.5 px-4 text-gray-600 hover:text-blue-500 hover:bg-gray-50">Profile</a>
							</li>
							<li>
								<a href="#" class="flex items-center text-[13px] py-1.5 px-4 text-gray-600 hover:text-blue-500 hover:bg-gray-50">Settings</a>
							</li>
							<li>
								<a href="#" class="flex items-center text-[13px] py-1.5 px-4 text-gray-600 hover:text-blue-500 hover:bg-gray-50">Logout</a>
							</li>
						</ul>
					</li>
				</ul>
			</div>
			<!-- end: Navbar -->

			<!-- start: Main Content -->
			<div class="mx-15 mt-6 p-4 bg-white shadow-md rounded-lg mb-3 flex justify-between items-center">
				<!-- Jumlah Invoice -->
				<p class="text-lg font-semibold text-gray-800">Total Invoices: <span id="invoiceCount" class="font-bold">0</span></p>

				<!-- Search Bar -->
				<div class="relative w-auto sm:w-1/2 md:w-1/3 lg:w-1/4 ml-auto">
					<i class="ri-search-line absolute top-1/2 ml-2 transform -translate-y-1/2 text-black"></i>
					<input id="searchInput" type="text" class="w-full py-2 px-4 pl-7 border rounded-md text-sm text-black" placeholder="Search..." onkeyup="filterInvoices()" />
				</div>
			</div>

			<!-- Invoices List dinamically -->
			<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-15" id="invoiceGrid">
				<!-- Invoice items will be dynamically populated here from JavaScript -->
			</div>
			<!-- end: Main Content -->

			<!-- Modal Peringatan Delete -->
			<div id="deleteModal" class="fixed inset-0 flex justify-center items-center bg-black/50 hidden">
				<div class="bg-white p-6 rounded-lg w-1/3">
					<h2 class="text-lg font-semibold text-gray-800 mb-4">Are you sure you want to delete this invoice?</h2>
					<div class="flex justify-end space-x-4">
						<button id="cancelDelete" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">Cancel</button>
						<button id="confirmDelete" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Delete</button>
					</div>
				</div>
			</div>
		</main>
		<!-- end: Main -->
	</body>
</html>
